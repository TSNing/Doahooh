<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 🎂 Made by  Doahooh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Sans+SC:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            /* 直接使用美乐蒂图片作为背景，移除渐变 */
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        /* 烟花画布 - 背景层 */
        #fireworkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .title-font {
            font-family: 'Pacifico', cursive;
        }
        
        /* 飘落彩带 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall linear forwards;
            z-index: 8;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 蛋糕动画 */
        .cake-container {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        /* 蜡烛火焰 */
        .flame {
            animation: flicker 0.5s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }
        
        @keyframes flicker {
            0% { transform: scaleY(1) scaleX(1); opacity: 1; }
            100% { transform: scaleY(1.1) scaleX(0.9); opacity: 0.8; }
        }
        
        .flame-out {
            animation: blowOut 0.5s ease-out forwards;
        }
        
        @keyframes blowOut {
            to {
                transform: scaleY(0);
                opacity: 0;
            }
        }
        
        /* 烟雾效果 */
        .smoke {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(200, 200, 200, 0.6);
            border-radius: 50%;
            opacity: 0;
            animation: smokeRise 2s ease-out forwards;
        }
        
        @keyframes smokeRise {
            0% { opacity: 0.8; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(2); }
        }
        
        /* 标题文字，改为深玫红色 */
        .gradient-text {
            color: #fff8dc;
            text-shadow: 0 2px 6px rgba(120, 50, 70, 0.45);
        }
        
        /* 心跳效果 */
        .heartbeat {
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
        
        /* 星星闪烁 */
        .star {
            position: absolute;
            color: #c93b68;
            animation: twinkle 2s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* 祝福卡片，半透明白底，深色文字 */
        .wish-card {
            backdrop-filter: blur(6px);
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        
        .wish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        /* 按钮发光效果 */
        .glow-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(201, 59, 104, 0.6);
            transform: scale(1.05);
        }
        
        /* 淡入动画 */
        .fade-in {
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }
        
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }
        .delay-4 { animation-delay: 1.2s; }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="relative">
    <!-- 烟花画布（背景层） -->
    <canvas id="fireworkCanvas"></canvas>
    
    <!-- 星星背景 -->
    <div id="stars-container" class="fixed inset-0 pointer-events-none z-0"></div>
    
    <!-- 主内容（最上层） -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-8">
        
        <!-- 标题 -->
        <h1 class="title-font text-5xl md:text-7xl gradient-text mb-4 fade-in text-center">
            Happy Birthday
        </h1>
        <p class="text-2xl md:text-3xl text-[#fff8dc] mb-8 fade-in delay-1 font-light tracking-wider" style="text-shadow: 0 2px 6px rgba(120, 50, 70, 0.45);">
            🎉 生日快乐 ！🎉
        </p>
        
        <!-- 蛋糕 -->
        <div class="cake-container mb-8 fade-in delay-2 relative">
            <div class="relative w-64 h-64 md:w-80 md:h-80">
                <svg viewBox="0 0 200 200" class="w-full h-full">
                    <!-- 底层 -->
                    <rect x="30" y="130" width="140" height="50" rx="5" fill="#f38181"/>
                    <rect x="30" y="140" width="140" height="8" fill="#fce38a"/>
                    
                    <!-- 中层 -->
                    <rect x="45" y="90" width="110" height="45" rx="5" fill="#aa96da"/>
                    <rect x="45" y="100" width="110" height="8" fill="#fcbad3"/>
                    
                    <!-- 顶层 -->
                    <rect x="60" y="55" width="80" height="40" rx="5" fill="#fcbad3"/>
                    
                    <!-- 奶油装饰 -->
                    <ellipse cx="100" cy="55" rx="40" ry="8" fill="#fff0f5"/>
                    <ellipse cx="100" cy="90" rx="55" ry="7" fill="#fff0f5"/>
                    <ellipse cx="100" cy="130" rx="70" ry="7" fill="#fff0f5"/>
                    
                    <!-- 蜡烛 -->
                    <g id="candles">
                        <rect x="75" y="25" width="6" height="30" rx="2" fill="#ff6b6b"/>
                        <rect x="97" y="20" width="6" height="35" rx="2" fill="#feca57"/>
                        <rect x="119" y="25" width="6" height="30" rx="2" fill="#48dbfb"/>
                    </g>
                    
                    <!-- 火焰 -->
                    <g id="flames">
                        <ellipse class="flame" cx="78" cy="20" rx="4" ry="8" fill="#ff9f43"/>
                        <ellipse class="flame" cx="100" cy="15" rx="5" ry="10" fill="#ff9f43"/>
                        <ellipse class="flame" cx="122" cy="20" rx="4" ry="8" fill="#ff9f43"/>
                    </g>
                    
                    <!-- 装饰点 -->
                    <circle cx="50" cy="150" r="4" fill="#fff"/>
                    <circle cx="80" cy="155" r="4" fill="#feca57"/>
                    <circle cx="120" cy="152" r="4" fill="#48dbfb"/>
                    <circle cx="150" cy="148" r="4" fill="#ff9ff3"/>
                </svg>
            </div>
            <p class="text-center text-[#fff8dc] text-sm mt-2" style="text-shadow: 0 2px 6px rgba(120, 50, 70, 0.45);">点击蜡烛吹灭它 ✨</p>
        </div>
        
        <!-- 祝福语 -->
        <div class="wish-card rounded-2xl p-6 md:p-8 max-w-lg w-full mb-8 fade-in delay-3">
            <div class="text-center">
                <div class="text-4xl mb-4 heartbeat inline-block">🎂</div>
                <h2 class="text-xl md:text-2xl text-[#b42e58] italic mb-4" style="font-family:'Pacifico','Noto Sans SC',serif;">Best wishes for you</h2>
                <p class="text-[#552033] leading-relaxed mb-4">
                    希望你天天开心^^勇敢做自己！<br>
                    心里有爱，眼里有光<br>
                    好好吃饭，好好睡觉<br>
                    
                </p>
                <p class="text-[#703044] text-sm">
                    —— To梁芷嘉小朋友
                </p>
            </div>
        </div>
        
        <!-- 互动按钮 -->
        <div class="flex flex-wrap gap-4 justify-center fade-in delay-4">
            <button id="wishBtn" class="glow-btn bg-gradient-to-r from-pink-500 to-orange-400 text-white px-8 py-3 rounded-full font-medium shadow-lg">
                🎁 拆礼物
            </button>
            <button id="fireworkBtn" class="glow-btn bg-gradient-to-r from-purple-500 to-pink-500 text-white px-8 py-3 rounded-full font-medium shadow-lg">
                🎆 放烟花
            </button>
            <button id="resetBtn" class="glow-btn bg-white/70 text-[#8b3a5c] px-8 py-3 rounded-full font-medium backdrop-blur border border-white/60">
                🕯️ 重燃蜡烛
            </button>
        </div>
        
        <!-- 底部 -->
        <p class="mt-12 text-[#fff8dc] text-sm fade-in delay-4" style="text-shadow: 0 2px 6px rgba(120, 50, 70, 0.45);">
            Made with ❤️ for you
        </p>
    </div>
    
    <!-- 礼物弹窗 -->
    <div id="giftModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeGift()"></div>
        <div class="relative bg-white rounded-3xl p-8 max-w-md mx-4 transform scale-0 transition-transform duration-500" id="giftBox">
            <div class="text-center">
                <div class="text-6xl mb-4">🎁</div>
                <h3 class="text-2xl font-bold text-[#b42e58] mb-4">惊喜礼物！</h3>
                <div class="space-y-3 text-[#552033] mb-6">
                    <p>✨ 生日快乐呀！！</p>
                    <p>🌷 支付宝输下面口令有小红包哦</p>
                    <p>10058888</p>
                    <p>🌸 最后还是要说一句</p>
                    <p>💖 很高兴认识你 ˋˏᰔᩚˎˊ</p>
                </div>
                <button onclick="closeGift()" class="bg-gradient-to-r from-pink-500 to-orange-400 text-white px-6 py-2 rounded-full">
                    收下礼物
                </button>
            </div>
        </div>
    </div>

    <script>
        // 生成飘落彩带
        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animationDuration = Math.random() * 3 + 3 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 6000);
                }, i * 100);
            }
        }
        
        // 生成星星背景
        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '✦';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = Math.random() * 15 + 10 + 'px';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = Math.random() * 2 + 2 + 's';
                container.appendChild(star);
            }
        }
        
        // 吹蜡烛效果
        function blowCandles() {
            const flames = document.querySelectorAll('.flame');
            flames.forEach((flame, index) => {
                setTimeout(() => {
                    flame.classList.add('flame-out');
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke';
                    smoke.style.left = flame.getBoundingClientRect().left + 'px';
                    smoke.style.top = flame.getBoundingClientRect().top + 'px';
                    document.body.appendChild(smoke);
                    setTimeout(() => smoke.remove(), 2000);
                }, index * 200);
            });
        }
        
        // 重燃蜡烛
        function relightCandles() {
            const flames = document.querySelectorAll('.flame');
            flames.forEach(flame => {
                flame.classList.remove('flame-out');
            });
        }
        
        // 礼物弹窗
        function openGift() {
            const modal = document.getElementById('giftModal');
            const box = document.getElementById('giftBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.style.transform = 'scale(1)';
            }, 50);
            createConfetti();
        }
        
        function closeGift() {
            const modal = document.getElementById('giftModal');
            const box = document.getElementById('giftBox');
            box.style.transform = 'scale(0)';
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // ========== Canvas背景烟花系统 ==========
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');
        let rockets = [];
        let particles = [];
        let animating = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const colors = ['#ff4757', '#ff6b81', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3', '#54a0ff', '#f368e0'];

        // 创建升空火箭
        function launchRocket(targetX, targetY) {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const startX = targetX + (Math.random() - 0.5) * 80;
            const startY = canvas.height + 20;
            
            rockets.push({
                x: startX,
                y: startY,
                targetX: targetX,
                targetY: targetY,
                color: color,
                speed: 8,
                trail: []
            });
            
            if (!animating) {
                animating = true;
                animate();
            }
        }

        // 爆炸粒子
        function explode(x, y, color) {
            const count = 80;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    alpha: 1,
                    decay: 0.012 + Math.random() * 0.008,
                    gravity: 0.05
                });
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 更新火箭
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                
                r.trail.push({ x: r.x, y: r.y, alpha: 1 });
                if (r.trail.length > 12) r.trail.shift();
                
                // 绘制尾迹
                for (let j = 0; j < r.trail.length; j++) {
                    const t = r.trail[j];
                    t.alpha -= 0.08;
                    if (t.alpha > 0) {
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
                        ctx.fillStyle = r.color;
                        ctx.globalAlpha = t.alpha;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                }
                
                // 移动火箭
                const dx = r.targetX - r.x;
                const dy = r.targetY - r.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < r.speed) {
                    explode(r.targetX, r.targetY, r.color);
                    rockets.splice(i, 1);
                } else {
                    r.x += (dx / dist) * r.speed;
                    r.y += (dy / dist) * r.speed;
                    
                    // 绘制火箭头部
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = r.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.99;
                p.vy *= 0.99;
                p.alpha -= p.decay;
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            if (rockets.length > 0 || particles.length > 0) {
                requestAnimationFrame(animate);
            } else {
                animating = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // 放烟花按钮：连续发射
        function launchFireworks() {
            const count = 8;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const x = 100 + Math.random() * (canvas.width - 200);
                    const y = 80 + Math.random() * (canvas.height * 0.35);
                    launchRocket(x, y);
                }, i * 300);
            }
            // 收尾大烟花
            setTimeout(() => {
                launchRocket(canvas.width / 2, 120);
            }, 2500);
        }
        
        // 事件绑定
        document.getElementById('wishBtn').addEventListener('click', openGift);
        document.getElementById('fireworkBtn').addEventListener('click', () => {
            launchFireworks();
            createConfetti();
        });
        document.getElementById('resetBtn').addEventListener('click', relightCandles);
        
        // 点击蛋糕吹蜡烛
        document.querySelector('.cake-container').addEventListener('click', blowCandles);
        
        // 点击页面任意位置放烟花
        document.addEventListener('click', (e) => {
            if (!e.target.closest('button') && !e.target.closest('.wish-card') && !e.target.closest('#giftModal')) {
                launchRocket(e.clientX, e.clientY);
            }
        });
        
        // 初始化
        window.addEventListener('load', () => {
            createStars();
            setTimeout(createConfetti, 500);
        });
    </script>
</body>
</html>
